[platformio]
default_envs = esp32s3_bringup
src_dir = main

[env:esp32s3_bringup]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
monitor_port = COM4
monitor_speed = 115200
upload_port = COM4
build_type = debug
build_flags =
    -D CONFIG_PROBE_ENABLE_ACCEL=1
    -D CONFIG_PROBE_SIMULATION_MODE=0
